<!DOCTYPE html>
<html>
<head>
    <title>Add Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
         body {
    background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    font-family: 'Inter', sans-serif;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Navbar */
.navbar {
    background: linear-gradient(90deg, #667eea, #764ba2);
    background-size: 200% 200%;
    animation: shimmer 12s linear infinite;
    border-bottom: none;
}
@keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* Card */
.card {
    border-radius: 20px;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    animation: fadeInUp 1.2s ease forwards;
    opacity: 0;
}
@keyframes fadeInUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* Form Inputs */
.form-control {
    border-radius: 12px;
    transition: all 0.3s ease;
}
.form-control:focus {
    box-shadow: 0 0 10px rgba(102,126,234,0.5);
    border-color: #667eea;
}

/* Buttons */
.btn {
    transition: all 0.3s ease;
    border-radius: 25px;
}
.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
.btn-custom {
    background: linear-gradient(90deg, #ff6a00, #ee0979);
    border: none;
    color: white;
}
.btn-custom:hover {
    background: linear-gradient(90deg, #ee0979, #ff6a00);
}

    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg shadow-sm"
     style="background: linear-gradient(90deg, #b3c1f2, #f0f9ff);">

    <div class="container" style="max-width: 900px;">

        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" href="/" style="gap: 10px;">
            <span style="font-size: 22px;">🔍</span>
            <div>
                <div style="font-weight: 600; color: #3730a3;">FindIt</div>
                <small style="font-size: 11px; color: #6b7280;">Lost & Found</small>
            </div>
        </a>

        <!-- Right Buttons -->
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-outline-dark btn-sm rounded-pill px-3">Home</a>
            <a href="/add/" class="btn btn-primary btn-sm rounded-pill px-3">+ Add</a>
        </div>

    </div>
</nav>

<!-- Centered Form -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div style="width: 100%; max-width: 600px;">

        <h4 class="text-center mb-4" style="font-weight:700;
        background: linear-gradient(90deg,#ff6a00,#ee0979);
        -webkit-background-clip:text; -webkit-text-fill-color:transparent;">
        ➕ Add Lost/Found Item
</h4>


        <div class="card shadow p-4">

            <form method="POST">
                {% csrf_token %}

                <input class="form-control mb-3" type="text" name="title" placeholder="Title" required>

                <textarea class="form-control mb-3" name="description" placeholder="Description" required></textarea>

                <select class="form-control mb-3" name="item_type">
                    <option value="lost">Lost</option>
                    <option value="found">Found</option>
                </select>

                <input class="form-control mb-3" type="text" name="location" placeholder="Location" required>

                <input class="form-control mb-3" type="text" name="contact" placeholder="Contact Info" required>

                <button class="btn btn-custom w-100">Submit</button>
            </form>

        </div>

    </div>
</div>

</body>
</html>
