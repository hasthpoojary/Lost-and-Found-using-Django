{% load humanize %}
<!DOCTYPE html>
<html>
<head>
    <title>Item Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>

    body {
    background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    font-family: 'Inter', sans-serif;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Navbar */
.navbar {
    background: linear-gradient(90deg, #667eea, #764ba2);
    background-size: 200% 200%;
    animation: shimmer 12s linear infinite;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}
@keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* Card */
.card {
    border-radius: 20px;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
}

/* Buttons */
.btn {
    transition: all 0.3s ease;
    border-radius: 30px;
}
.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
.btn-custom {
    background: linear-gradient(90deg, #ff6a00, #ee0979);
    color: white;
    border: none;
}
.btn-custom:hover {
    background: linear-gradient(90deg, #ee0979, #ff6a00);
}

/* Badge */
.badge {
    font-size: 0.9rem;
    padding: 6px 12px;
    border-radius: 12px;
}
.item-title {
    font-weight: 700;
    font-size: 1.1rem;
    color: #4f46e5; /* deep indigo accent */
    background: linear-gradient(90deg, #ff6a00, #ee0979);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg shadow-sm"
     style="background: linear-gradient(90deg, #b3c1f2, #f0f9ff);">

    <div class="container" style="max-width: 900px;">

        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" href="/" style="gap: 10px;">
            <span style="font-size: 22px;">🔍</span>
            <div>
                <div style="font-weight: 600; color: #3730a3;">FindIt</div>
                <small style="font-size: 11px; color: #6b7280;">Lost & Found</small>
            </div>
        </a>

        <!-- Right Buttons -->
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-outline-dark btn-sm rounded-pill px-3">Home</a>
            <a href="/add/" class="btn btn-primary btn-sm rounded-pill px-3">+ Add</a>
        </div>

    </div>
</nav>

<div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow-lg p-4" style="max-width: 600px;">

        <h3 class="item-title">{{ item.title }}</h3>


        <span class="badge 
            {% if item.item_type == 'lost' %}
                bg-danger
            {% else %}
                bg-success
            {% endif %}
        ">
            {{ item.item_type|title }}
        </span>

        <hr>

        <p><strong>Description:</strong><br>{{ item.description }}</p>
        <p><strong><i class="bi bi-geo-alt-fill"></i> Location:</strong> {{ item.location }}</p>
        <p><strong><i class="bi bi-telephone-fill"></i> Contact:</strong> {{ item.contact }}</p>
        <p><strong><i class="bi bi-calendar-event-fill"></i> Posted on:</strong> {{ item.date_posted|naturaltime }}</p>

        <div class="d-flex justify-content-between mt-3">
            <a href="/" class="btn btn-secondary">Back</a>

            <a href="/delete/{{ item.id }}/"
               class="btn btn-danger"
               onclick="return confirm('Delete this item?')">
               Delete
            </a>
        </div>

    </div>

</div>

</body>
</html>
